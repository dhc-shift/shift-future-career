<!doctype html>
<!-- 카카오톡·SNS 미리보기 이미지(og-image.png) 원본. 1200×630으로 캡처해 사용한다. 사이트에서는 쓰지 않는다. -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&family=Manrope:wght@800&family=Noto+Sans+KR:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; margin:0; }
  body { width:1200px; height:630px; overflow:hidden; background:#172323; color:#fff; font-family:'Manrope','Noto Sans KR',sans-serif; }
  .wrap { position:relative; height:100%; padding:78px 84px; display:flex; justify-content:space-between; align-items:center; }
  .kicker { color:#f4d77c; font:500 15px 'DM Mono',monospace; letter-spacing:.22em; }
  .logo { margin-top:22px; font-size:96px; font-weight:800; letter-spacing:-.05em; line-height:.95; }
  .logo span { display:block; color:#df714c; }
  .sub { margin-top:30px; color:#d6dfdb; font:700 30px 'Noto Sans KR',sans-serif; letter-spacing:-.02em; }
  .foot { position:absolute; left:84px; bottom:56px; color:#8fa19b; font:500 15px 'DM Mono','Noto Sans KR',monospace; letter-spacing:.1em; }
  .card { width:360px; padding:30px 30px 26px; background:#f7faf7; color:#172323; border-top:6px solid #df714c; box-shadow:0 30px 60px #0008; transform:rotate(3deg); }
  .card .label { color:#df714c; font:500 12px 'DM Mono',monospace; letter-spacing:.16em; }
  .card h3 { margin:10px 0 18px; font:800 26px 'Noto Sans KR',sans-serif; letter-spacing:-.02em; }
  .step { display:flex; align-items:center; gap:12px; padding:12px 0; border-top:1px solid #d9e3df; font:700 18px 'Noto Sans KR',sans-serif; }
  .step b { display:grid; place-items:center; width:28px; height:28px; border-radius:50%; background:#166b58; color:#fff; font:500 13px 'DM Mono',monospace; }
  .dot { position:absolute; right:120px; top:70px; width:150px; height:150px; border-radius:50%; background:#f4d77c; opacity:.18; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="dot"></div>
    <div>
      <div class="kicker">MY FUTURE, MY SHIFT</div>
      <div class="logo">FUTURE<span>RESUME</span></div>
      <p class="sub">졸업할 때 낼 첫 이력서, 미리 써보기</p>
    </div>
    <div class="card">
      <div class="label">HOW IT WORKS</div>
      <h3>나의 미래 이력서</h3>
      <div class="step"><b>1</b>쌓고 싶은 경험 담기</div>
      <div class="step"><b>2</b>지원 직무·기업 고르기</div>
      <div class="step"><b>3</b>직무별 자기소개서 쓰기</div>
    </div>
    <div class="foot">SHIFT · 연세대학교 디지털헬스케어학부</div>
  </div>
</body>
</html>
